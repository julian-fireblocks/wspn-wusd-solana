[package]
name = "wusd-token"
version = "1.0.0"
description = "WSPN WUSD TOKEN"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "wusd_token"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
init-if-needed = ["anchor-lang/init-if-needed"]

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
spl-token-2022 = { version = "0.9.0" }
anchor-spl = { version = "0.29.0", features = ["token", "associated_token", "spl-token-2022", "token_2022"] }
solana-program = "=1.18.16" 
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"