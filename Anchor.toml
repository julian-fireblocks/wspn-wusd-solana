[toolchain]
anchor_version = "0.29.0"

[features]
seeds = false
skip-lint = false

[programs.devnet]
wusd_token = "3NDAD3Duff9rftUo2amTjTtf2KMGpxHvn7qZ5cz9p97Q"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "http://localhost:8899"
wallet = "./deploy-keypair.json"

[workspace]
members = ["programs/wusd-token"]

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = true

[test.validator]
bind_address = "localhost"
ledger = ".anchor/test-ledger"
rpc_port = 8899
